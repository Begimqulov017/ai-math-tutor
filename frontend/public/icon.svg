  <circle cx="420" cy="90" r="54" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="90" cy="420" r="70" fill="#ffffff" fill-opacity="0.04" />

  <!-- Stylized Math Summation / Function Icon -->
  <g filter="url(#glow)">
    <path d="M 148 140
             L 364 140
             C 375 140, 384 149, 384 160
             C 384 168, 379 175, 372 179
             L 248 256
             L 372 333
             C 379 337, 384 344, 384 352
             C 384 363, 375 372, 364 372
             L 148 372
             C 137 372, 128 363, 128 352
             C 128 341, 137 332, 148 332
             L 316 332
             L 214 269
             C 203 262, 198 259, 198 256
             C 198 253, 203 250, 214 243
             L 316 180
             L 148 180
             C 137 180, 128 171, 128 160
             C 128 149, 137 140, 148 140 Z"
          fill="url(#symbolGrad)" />
  </g>

  <!-- Smart AI Sparkle -->
  <path d="M 370 120
           Q 370 145, 395 145
           Q 370 145, 370 170
           Q 370 145, 345 145
